<script>
  const playlistData = [
    { title: "Royalty Free Electronica", url: "/assets/audio/track1.mp3" }
  ];

  const playerStateKey = "cliamp-player-state";

  let audioCtx, analyser, audioSource, sourceNode;
  let currentIndex = 0;
  let isInitialized = false;

  const audioEl = new Audio();
  audioEl.crossOrigin = "anonymous";

  const playBtn = document.getElementById('play-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const playlistSelect = document.getElementById('playlist-select');
  const trackTitleDisplay = document.getElementById('track-title');
  const playerStatus = document.getElementById('player-status');
  const canvas = document.getElementById('visualizerCanvas');
  const canvasCtx = canvas.getContext('2d');

  playlistData.forEach((track, index) => {
    const opt = document.createElement('option');
    opt.value = index;
    opt.textContent = track.title;
    playlistSelect.appendChild(opt);
  });

  function initAudioPipeline() {
    if (isInitialized) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64; 

    sourceNode = audioCtx.createMediaElementSource(audioEl);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);

    isInitialized = true;
  }

  function loadTrack(index) {
    currentIndex = index;
    audioEl.src = playlistData[currentIndex].url;
    trackTitleDisplay.textContent = playlistData[currentIndex].title;
    playlistSelect.selectedIndex = currentIndex;
    savePlayerState();
  }

  function savePlayerState() {
    sessionStorage.setItem(playerStateKey, JSON.stringify({
      index: currentIndex,
      time: Number.isFinite(audioEl.currentTime) ? audioEl.currentTime : 0,
      playing: !audioEl.paused
    }));
  }

  function startPlayback() {
    initAudioPipeline();
    if (audioCtx.state === "suspended") audioCtx.resume();

    audioEl.play().then(() => {
      playerStatus.textContent = "Playing";
      savePlayerState();
      visualize();
    }).catch(e => {
      playerStatus.textContent = "Paused";
      console.log("Playback error:", e);
    });
  }

  playBtn.addEventListener('click', () => {
    if (!audioEl.src) loadTrack(currentIndex);
    startPlayback();
  });

  pauseBtn.addEventListener('click', () => {
    audioEl.pause();
    playerStatus.textContent = "Paused";
    savePlayerState();
  });

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % playlistData.length;
    loadTrack(currentIndex);
    startPlayback();
  });

  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + playlistData.length) % playlistData.length;
    loadTrack(currentIndex);
    startPlayback();
  });

  playlistSelect.addEventListener('change', (e) => {
    loadTrack(parseInt(e.target.value));
    startPlayback();
  });

  audioEl.addEventListener('ended', () => {
    nextBtn.click();
  });

  let savedState = null;
  try {
    savedState = JSON.parse(sessionStorage.getItem(playerStateKey));
  } catch (_) {}

  loadTrack(savedState && Number.isInteger(savedState.index)
    ? Math.max(0, Math.min(savedState.index, playlistData.length - 1))
    : 0);

  audioEl.addEventListener("loadedmetadata", () => {
    if (savedState && Number.isFinite(savedState.time)) {
      audioEl.currentTime = Math.min(savedState.time, audioEl.duration || savedState.time);
    }
    if (savedState && savedState.playing) startPlayback();
  });

  audioEl.addEventListener("timeupdate", savePlayerState);
  audioEl.addEventListener("play", savePlayerState);
  audioEl.addEventListener("pause", savePlayerState);
  window.addEventListener("beforeunload", savePlayerState);

  function visualize() {
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);

      const styles = getComputedStyle(document.documentElement);
      canvasCtx.fillStyle = styles.getPropertyValue('--body-background').trim();
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      const barColor = styles.getPropertyValue('--accent-color').trim();

      let barWidth = (canvas.width / bufferLength) * 1.8;
      let barHeight;
      let x = 2;

      for (let i = 0; i < bufferLength; i++) {
        barHeight = (dataArray[i] / 255) * canvas.height;

        canvasCtx.fillStyle = barColor;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);

        x += barWidth + 1;
      }
    }
    draw();
  }
</script>


    <script>
        (() => {
            const shouldHandle = (anchor) => {
                if (!anchor || anchor.target === "_blank" || anchor.hasAttribute("download")) return false;
                if (anchor.origin !== window.location.origin) return false;
                const url = new URL(anchor.href);
                return url.pathname !== window.location.pathname || url.search !== window.location.search;
            };

            const replacePage = async (url, push = true) => {
                const response = await fetch(url, { headers: { "X-Requested-With": "XMLHttpRequest" } });
                if (!response.ok) throw new Error(`Navigation failed: ${response.status}`);

                const html = await response.text();
                const parsed = new DOMParser().parseFromString(html, "text/html");
                const currentMain = document.querySelector("main.main");
                const nextMain = parsed.querySelector("main.main");
                if (!currentMain || !nextMain) {
                    window.location.assign(url);
                    return;
                }

                const nextMainClone = nextMain.cloneNode(true);
                const pageScripts = Array.from(nextMainClone.querySelectorAll("script")).map((oldScript) => {
                    const script = document.createElement("script");
                    for (const attribute of oldScript.attributes) {
                        script.setAttribute(attribute.name, attribute.value);
                    }
                    script.textContent = oldScript.textContent;
                    oldScript.remove();
                    return script;
                });

                currentMain.replaceWith(nextMainClone);
                pageScripts.forEach((script) => document.body.appendChild(script));
                document.body.className = parsed.body.className;
                document.documentElement.lang = parsed.documentElement.lang || document.documentElement.lang;
                document.documentElement.dir = parsed.documentElement.dir || document.documentElement.dir;

                const currentContainer = document.querySelector(".main-container");
                const nextContainer = parsed.querySelector(".main-container");
                if (currentContainer && nextContainer) {
                    currentContainer.className = nextContainer.className;
                }

                const currentRight = document.querySelector(".right-sidebar");
                const nextRight = parsed.querySelector(".right-sidebar");
                if (nextRight && currentRight) {
                    currentRight.replaceWith(nextRight.cloneNode(true));
                } else if (!nextRight && currentRight) {
                    currentRight.remove();
                }

                document.title = parsed.title;
                if (push) history.pushState({}, "", url);
                window.scrollTo({ top: 0, behavior: "auto" });

                document.querySelectorAll("#main-menu a").forEach((link) => {
                    const item = link.closest("li");
                    if (item) item.classList.toggle("current", new URL(link.href).pathname === new URL(url).pathname);
                });

                if (window.Stack && typeof window.Stack.init === "function") {
                    window.Stack.init();
                }
                window.dispatchEvent(new Event("persistent-navigation"));
            };

            document.addEventListener("click", (event) => {
                const anchor = event.target.closest("a");
                if (!anchor || event.defaultPrevented || event.button !== 0 ||
                    event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
                    !shouldHandle(anchor)) return;

                event.preventDefault();
                replacePage(anchor.href).catch(() => window.location.assign(anchor.href));
            });

            window.addEventListener("popstate", () => {
                replacePage(window.location.href, false).catch(() => window.location.reload());
            });
        })();
    </script>
