<div id="cliamp-player-container">
  <div class="cliamp-window">
    <div class="cliamp-header">
      <span class="cliamp-logo">Audio player</span>
      <span class="cliamp-status" id="player-status">Stopped</span>
    </div>
    
    <!-- Visualizer Spectrum Screen -->
    <div class="cliamp-screen">
      <canvas id="visualizerCanvas" width="300" height="100"></canvas>
    </div>

    <!-- Track Display -->
    <div class="cliamp-track-display">
      <span class="track-label">PLAYING:</span>
      <span id="track-title">No track loaded...</span>
    </div>

    <!-- Playlist Box -->
    <div class="cliamp-playlist">
      <select id="playlist-select" size="4"></select>
    </div>

    <!-- TUI Control Deck -->
    <div class="cliamp-controls">
      <button id="prev-btn" title="Previous">|&lt;&lt;</button>
      <button id="play-btn" title="Play">&gt;</button>
      <button id="pause-btn" title="Pause">||</button>
      <button id="next-btn" title="Next">&gt;&gt;|</button>
    </div>
  </div>
</div>

<style>
  #cliamp-player-container {
    display: flex;
    justify-content: center;
    font-family: var(--base-font-family);
    margin: 14px 0;
    width: 100%;
  }
  .cliamp-window {
    background-color: var(--card-background);
    border: 1px solid var(--card-separator-color);
    border-radius: var(--card-border-radius);
    box-shadow: var(--shadow-l1);
    width: min(330px, 100%);
    padding: 12px;
    color: var(--card-text-color-main);
  }
  .cliamp-header {
    color: var(--card-text-color-main);
    padding: 0 2px 8px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--card-separator-color);
  }
  .cliamp-screen {
    background-color: var(--body-background);
    border: 1px solid var(--card-separator-color);
    border-radius: calc(var(--card-border-radius) - 4px);
    margin-bottom: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100px;
  }
  .cliamp-track-display {
    background-color: var(--body-background);
    border: 1px solid var(--card-separator-color);
    border-radius: 7px;
    padding: 7px 8px;
    font-size: 12px;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-label {
    color: var(--card-text-color-secondary);
    margin-right: 4px;
  }
  .cliamp-playlist select {
    width: 100%;
    background-color: var(--body-background);
    color: var(--card-text-color-main);
    border: 1px solid var(--card-separator-color);
    border-radius: 7px;
    font-family: var(--base-font-family);
    font-size: 12px;
    height: 75px;
    padding: 3px;
    margin-bottom: 8px;
  }
  .cliamp-playlist select option:checked {
    background-color: var(--card-background-selected);
    color: var(--card-text-color-main);
  }
  .cliamp-controls {
    display: flex;
    gap: 6px;
  }
  .cliamp-controls button {
    flex: 1;
    background-color: var(--card-background-selected);
    color: var(--card-text-color-main);
    border: 1px solid var(--card-separator-color);
    border-radius: 7px;
    padding: 7px 0;
    font-family: var(--base-font-family);
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }
  .cliamp-controls button:hover {
    background-color: var(--accent-color);
    border-color: var(--accent-color);
    color: var(--accent-color-text);
  }
  .cliamp-controls button:active {
    transform: translateY(1px);
  }
</style>

<script>
  const playlistData = [
    { title: "Royalty Free Electronica", url: "/assets/audio/track1.mp3" }
  ];

  const playerStateKey = "cliamp-player-state";

  let audioCtx, analyser, audioSource, sourceNode;
  let currentIndex = 0;
  let isInitialized = false;

  const audioEl = new Audio();
  audioEl.crossOrigin = "anonymous";

  const playBtn = document.getElementById('play-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const playlistSelect = document.getElementById('playlist-select');
  const trackTitleDisplay = document.getElementById('track-title');
  const playerStatus = document.getElementById('player-status');
  const canvas = document.getElementById('visualizerCanvas');
  const canvasCtx = canvas.getContext('2d');

  playlistData.forEach((track, index) => {
    const opt = document.createElement('option');
    opt.value = index;
    opt.textContent = track.title;
    playlistSelect.appendChild(opt);
  });

  function initAudioPipeline() {
    if (isInitialized) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64; // Fewer bins give a chunkier terminal bar graph look

    sourceNode = audioCtx.createMediaElementSource(audioEl);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);

    isInitialized = true;
  }

  function loadTrack(index) {
    currentIndex = index;
    audioEl.src = playlistData[currentIndex].url;
    trackTitleDisplay.textContent = playlistData[currentIndex].title;
    playlistSelect.selectedIndex = currentIndex;
    savePlayerState();
  }

  function savePlayerState() {
    sessionStorage.setItem(playerStateKey, JSON.stringify({
      index: currentIndex,
      time: Number.isFinite(audioEl.currentTime) ? audioEl.currentTime : 0,
      playing: !audioEl.paused
    }));
  }

  function startPlayback() {
    initAudioPipeline();
    if (audioCtx.state === "suspended") audioCtx.resume();

    audioEl.play().then(() => {
      playerStatus.textContent = "Playing";
      savePlayerState();
      visualize();
    }).catch(e => {
      playerStatus.textContent = "Paused";
      console.log("Playback error:", e);
    });
  }

  playBtn.addEventListener('click', () => {
    if (!audioEl.src) loadTrack(currentIndex);
    startPlayback();
  });

  pauseBtn.addEventListener('click', () => {
    audioEl.pause();
    playerStatus.textContent = "Paused";
    savePlayerState();
  });

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % playlistData.length;
    loadTrack(currentIndex);
    startPlayback();
  });

  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + playlistData.length) % playlistData.length;
    loadTrack(currentIndex);
    startPlayback();
  });

  playlistSelect.addEventListener('change', (e) => {
    loadTrack(parseInt(e.target.value));
    startPlayback();
  });

  audioEl.addEventListener('ended', () => {
    nextBtn.click();
  });

  let savedState = null;
  try {
    savedState = JSON.parse(sessionStorage.getItem(playerStateKey));
  } catch (_) {}

  loadTrack(savedState && Number.isInteger(savedState.index)
    ? Math.max(0, Math.min(savedState.index, playlistData.length - 1))
    : 0);

  audioEl.addEventListener("loadedmetadata", () => {
    if (savedState && Number.isFinite(savedState.time)) {
      audioEl.currentTime = Math.min(savedState.time, audioEl.duration || savedState.time);
    }
    if (savedState && savedState.playing) startPlayback();
  });

  audioEl.addEventListener("timeupdate", savePlayerState);
  audioEl.addEventListener("play", savePlayerState);
  audioEl.addEventListener("pause", savePlayerState);
  window.addEventListener("beforeunload", savePlayerState);

  function visualize() {
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);

      const styles = getComputedStyle(document.documentElement);
      canvasCtx.fillStyle = styles.getPropertyValue('--body-background').trim();
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      const barColor = styles.getPropertyValue('--accent-color').trim();

      let barWidth = (canvas.width / bufferLength) * 1.8;
      let barHeight;
      let x = 2;

      for (let i = 0; i < bufferLength; i++) {
        barHeight = (dataArray[i] / 255) * canvas.height;

        canvasCtx.fillStyle = barColor;
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);

        x += barWidth + 1;
      }
    }
    draw();
  }
</script>
